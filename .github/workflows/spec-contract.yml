name: Spec contract (fast)

on:
  pull_request:
    paths:
      - AGENTS.md
      - docs/specs/**
      - docs/process/**
      - scripts/check_spec_contract.py
      - .github/workflows/spec-contract.yml
      - .github/PULL_REQUEST_TEMPLATE.md

permissions:
  contents: read

concurrency:
  group: spec-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-spec-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Compile validator
        run: python3 -m py_compile scripts/check_spec_contract.py
      - name: Test contract validator (fast, isolated stdlib)
        run: python3 -m unittest discover -s tests -p test_spec_contract.py -v
      - name: Validate changed task specs and AGENTS anchor
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_spec_contract.py --base "$PR_BASE_SHA"
