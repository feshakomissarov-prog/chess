name: Windows tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-chart-review:
    name: L1/L2 Home chart review
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: L1 diff and compile checks
        run: |
          git diff --check HEAD^ HEAD
          python -m py_compile src/chess_coach/ui/pages/home.py scripts/capture_visual_master.py tests/test_home_graph_acceptance.py tests/test_home_rating_sparkline.py
      - name: L1 targeted Home graph and rating tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -X faulthandler -m pytest -o addopts= -q
          tests/test_home_graph_acceptance.py tests/test_home_rating_sparkline.py
      - name: Configure native display for Home chart captures
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Primary display: $($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -lt 1672 -or $bounds.Height -lt 941) {
            throw "Runner display cannot fit the 1672x941 Home chart capture."
          }
      - name: L2 native 100% and compact Home chart captures
        shell: pwsh
        run: |
          $cases = @(
            @{ Scale = "1"; Sizes = "1672x941,1280x720" },
            @{ Scale = "1.25"; Sizes = "1280x720" },
            @{ Scale = "1.5"; Sizes = "1120x640" }
          )
          foreach ($case in $cases) {
            $env:QT_SCALE_FACTOR = $case.Scale
            $env:CC_VISUAL_SCOPE = "home-chart-review"
            $env:CC_VISUAL_TARGET_SIZES = $case.Sizes
            $env:CC_VISUAL_OUTPUT = "visual-evidence/home-chart-review/scale-$($case.Scale)"
            $env:CC_VISUAL_LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "home-chart-review-localappdata-$($case.Scale)"
            python -X faulthandler scripts/capture_visual_master.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-chart-l1-l2-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/home-chart-review/
          if-no-files-found: error
  test:
    needs: home-chart-review
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Report Python and Qt runtime versions
        run: >-
          python -c "import sys, platform, PySide6, shiboken6; from PySide6.QtCore import qVersion; print('Python:', sys.version); print('Windows:', platform.platform()); print('PySide6:', PySide6.__version__); print('Qt:', qVersion()); print('shiboken6:', shiboken6.__version__); print('shiboken6 module:', shiboken6.__file__)"
      - name: Run offscreen tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -o addopts= -q -W error::pytest.PytestUnhandledThreadExceptionWarning
      - name: Compile application and tests
        run: python -m compileall -q src tests
      - name: Initialize the isolated offline window
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -X faulthandler -c "from PySide6.QtWidgets import QApplication; from chess_coach.window import MainWindow; app = QApplication([]); window = MainWindow(offline_mode=True); assert window.lichess is None; window.close()"
  visual-evidence:
    needs: home-chart-review
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Configure runner display for approved reference sizes
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Primary display: $($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -lt 1672 -or $bounds.Height -lt 941) {
            throw "Runner display cannot fit the approved 1672x941 capture."
          }
      - name: Capture native Windows Qt screens
        env:
          CC_VISUAL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          foreach ($scale in @("1", "1.25", "1.5")) {
            $env:QT_SCALE_FACTOR = $scale
            $env:CC_VISUAL_OUTPUT = "visual-evidence/scale-$scale"
            # Side-by-side images include approved reference artwork; keep them
            # outside the synthetic-only public visual-evidence artifact.
            $env:CC_VISUAL_COMPARE_OUTPUT = "visual-pairs/scale-$scale"
            if ($scale -eq "1") {
              Remove-Item Env:CC_VISUAL_TARGET_SIZES -ErrorAction SilentlyContinue
            } elseif ($scale -eq "1.25") {
              $env:CC_VISUAL_TARGET_SIZES = "1280x720"
            } else {
              $env:CC_VISUAL_TARGET_SIZES = "1120x640"
            }
            python -X faulthandler scripts/capture_visual_master.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $referencePairs = Get-ChildItem -LiteralPath "visual-evidence" -Filter "pair-*.png" -Recurse -ErrorAction SilentlyContinue
          if ($referencePairs) {
            throw "Public visual-evidence must not include side-by-side reference images."
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-master-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/
          if-no-files-found: error
