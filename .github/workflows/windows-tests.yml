name: Windows tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offscreen tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -o addopts= -q
      - name: Compile application and tests
        run: python -m compileall -q src tests
      - name: Initialize the isolated offline window
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -c "from PySide6.QtWidgets import QApplication; from chess_coach.window import MainWindow; app = QApplication([]); window = MainWindow(offline_mode=True); assert window.lichess is None; window.close()"
