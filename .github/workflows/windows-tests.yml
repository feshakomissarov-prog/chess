name: Windows tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Report Python and Qt runtime versions
        run: >-
          python -c "import sys, platform, PySide6, shiboken6; from PySide6.QtCore import qVersion; print('Python:', sys.version); print('Windows:', platform.platform()); print('PySide6:', PySide6.__version__); print('Qt:', qVersion()); print('shiboken6:', shiboken6.__version__); print('shiboken6 module:', shiboken6.__file__)"
      - name: Run offscreen tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -o addopts= -q -W error::pytest.PytestUnhandledThreadExceptionWarning
      - name: Compile application and tests
        run: python -m compileall -q src tests
      - name: Initialize the isolated offline window
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -X faulthandler -c "from PySide6.QtWidgets import QApplication; from chess_coach.window import MainWindow; app = QApplication([]); window = MainWindow(offline_mode=True); assert window.lichess is None; window.close()"
  visual-evidence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Configure runner display for approved reference sizes
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Auto)]
          public struct DisplayMode {
            [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
            public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
            public int dmFields;
            public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
            public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
            [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
            public short dmLogPixels;
            public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
            public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2;
            public int dmPanningWidth, dmPanningHeight;
          }
          public static class DisplayModeApi {
            [DllImport("user32.dll", CharSet = CharSet.Auto)]
            public static extern int EnumDisplaySettings(string deviceName, int modeNum, ref DisplayMode mode);
            [DllImport("user32.dll", CharSet = CharSet.Auto)]
            public static extern int ChangeDisplaySettings(ref DisplayMode mode, int flags);
          }
          '@
          $mode = New-Object DisplayMode
          $mode.dmSize = [Runtime.InteropServices.Marshal]::SizeOf($mode)
          if ([DisplayModeApi]::EnumDisplaySettings($null, -1, [ref]$mode) -eq 0) {
            throw "Unable to read runner display mode."
          }
          if ($mode.dmPelsWidth -lt 1672 -or $mode.dmPelsHeight -lt 941) {
            $mode.dmPelsWidth = 1920
            $mode.dmPelsHeight = 1080
            $mode.dmFields = 0x00080000 -bor 0x00100000
            $result = [DisplayModeApi]::ChangeDisplaySettings([ref]$mode, 0)
            if ($result -ne 0) { throw "Unable to set runner display mode; ChangeDisplaySettings returned $result." }
          }
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Primary display: $($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -lt 1672 -or $bounds.Height -lt 941) {
            throw "Runner display cannot fit the approved 1672x941 capture."
          }
      - name: Capture native Windows Qt screens
        env:
          CC_VISUAL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          foreach ($scale in @("1", "1.25", "1.5")) {
            $env:QT_SCALE_FACTOR = $scale
            $env:CC_VISUAL_OUTPUT = "visual-evidence/scale-$scale"
            if ($scale -eq "1") {
              Remove-Item Env:CC_VISUAL_TARGET_SIZES -ErrorAction SilentlyContinue
            } elseif ($scale -eq "1.25") {
              $env:CC_VISUAL_TARGET_SIZES = "1280x720"
            } else {
              $env:CC_VISUAL_TARGET_SIZES = "1120x640"
            }
            python -X faulthandler scripts/capture_visual_master.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: visual-master-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/
          if-no-files-found: error
