name: Windows tests

on:
  pull_request:
    # A deliberate Ready-for-review transition is the automated final L3 gate.
    # This avoids asking the owner to use workflow_dispatch or relaunching
    # the entire Windows matrix after every code edit in a Draft PR.
    types: [opened, synchronize, reopened, ready_for_review]
    # Changes limited to Markdown must not start the expensive Windows matrix.
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete CI executions when another commit is pushed to the same PR.
# The final exact-head run is still required before accepting code changes.
concurrency:
  group: windows-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  home-chart-review:
    name: L1/L2 Home chart review
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || (github.event.pull_request.head.ref != 'codex/review-ux-01-game-analysis-2026-11-14' && github.event.pull_request.head.ref != 'codex/puzzle-ux-02-lichess-training-2026-11-19' && github.event.pull_request.head.ref != 'codex/puz-ux-03-online-puzzle-playability-2026-11-20' && github.event.pull_request.head.ref != 'codex/puz-ux-05-owner-live-next-replay')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: L1 diff and compile checks
        run: |
          git diff --check HEAD^ HEAD
          python -m py_compile src/chess_coach/ui/pages/home.py src/chess_coach/window.py src/chess_coach/application/lichess_coverage_audit.py scripts/audit_lichess_coverage.py scripts/capture_visual_master.py tests/test_lichess_coverage_audit.py tests/test_visual_master_final_regressions.py tests/test_ui_pages.py
      - name: L1 targeted Home geometry and Lichess coverage tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -X faulthandler -m pytest -o addopts= -q
          tests/test_visual_master_final_regressions.py tests/test_ui_pages.py
          tests/test_lichess_coverage_audit.py tests/test_dashboard.py
      - name: Configure native display for Home chart captures
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Primary display: $($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -lt 1672 -or $bounds.Height -lt 941) {
            throw "Runner display cannot fit the 1672x941 Home chart capture."
          }
      - name: L2 native 100% and compact Home chart captures
        shell: pwsh
        run: |
          $cases = @(
            @{ Scale = "1"; Sizes = "1672x941,1280x720" },
            @{ Scale = "1.25"; Sizes = "1280x720" },
            @{ Scale = "1.5"; Sizes = "1120x640" }
          )
          foreach ($case in $cases) {
            $env:QT_SCALE_FACTOR = $case.Scale
            $env:CC_VISUAL_SCOPE = "home-chart-review"
            $env:CC_VISUAL_TARGET_SIZES = $case.Sizes
            $env:CC_VISUAL_OUTPUT = "visual-evidence/home-chart-review/scale-$($case.Scale)"
            $env:CC_VISUAL_LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "home-chart-review-localappdata-$($case.Scale)"
            python -X faulthandler scripts/capture_visual_master.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-chart-l1-l2-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/home-chart-review/
          if-no-files-found: warn
  puz-ux-03-l2:
    name: L2 PUZ-UX-03 online and Qt review
    # PUZ-UX-03 L2 runs sequentially after L1 in puzzle-ux-02-verification;
    # never race its native/live checks with the final ready_for_review L3.
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'codex/puz-ux-03-online-puzzle-playability-2026-11-20'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: L1 compile and targeted L2 regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m py_compile src/chess_coach/board_view.py src/chess_coach/lichess/puzzle_training.py src/chess_coach/ui/pages/puzzle_training.py src/chess_coach/window.py src/chess_coach/infrastructure/sqlite/constants.py src/chess_coach/infrastructure/sqlite/migrations.py src/chess_coach/infrastructure/sqlite/puzzles.py scripts/puz_ux_03_live_public_smoke.py scripts/puz_ux_03_mainwindow_live_integration.py
          python -X faulthandler -m pytest -o addopts= -q -W error::pytest.PytestUnhandledThreadExceptionWarning tests/test_puzzle_training.py tests/test_puzzle_training_ui.py tests/test_puzzle_training_navigation.py tests/test_puzzle_training_async.py tests/test_puzzle_training_store.py tests/test_puzzle_api_adapter.py tests/test_board_view.py tests/test_m45_analysis_store.py tests/test_m45_openings.py tests/test_window.py tests/test_puz_ux_03_interaction.py tests/test_puz_ux_03_rating.py
      - name: Configure isolated native Qt display
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "PUZ-UX-03 L2 native display: $($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -lt 1672 -or $bounds.Height -lt 941) {
            throw "Runner display cannot fit the 1672x941 puzzle capture."
          }
      - name: Play three public Lichess puzzles in the real Qt page
        env:
          CC_PUZ_UX_03_LIVE_OUTPUT: visual-evidence/puz-ux-03-live-public
          CC_PUZ_UX_03_LIVE_DPI: "1"
          LOCALAPPDATA: ${{ runner.temp }}\puz-ux-03-live-localappdata
        run: python -u -X faulthandler scripts/puz_ux_03_live_public_smoke.py
      - name: Capture puzzle trainer at 100, 125, and 150 percent DPI
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}\puz-ux-03-visual-localappdata
        run: |
          $cases = @(
            @{ Scale = "1"; Size = "1672x941" },
            @{ Scale = "1.25"; Size = "1280x720" },
            @{ Scale = "1.5"; Size = "1120x640" }
          )
          foreach ($case in $cases) {
            $env:QT_SCALE_FACTOR = $case.Scale
            $env:CC_PUZZLE_VISUAL_SIZE = $case.Size
            $env:CC_PUZZLE_VISUAL_OUTPUT = "visual-evidence/puz-ux-03-dpi/scale-$($case.Scale)"
            python -X faulthandler scripts/capture_puzzle_training.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puz-ux-03-l2-${{ github.event.pull_request.head.sha }}
          path: visual-evidence/puz-ux-03-*
          if-no-files-found: warn
  test:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || (github.event.pull_request.head.ref != 'codex/review-ux-01-game-analysis-2026-11-14' && github.event.pull_request.head.ref != 'codex/puzzle-ux-02-lichess-training-2026-11-19' && github.event.pull_request.head.ref != 'codex/puz-ux-03-online-puzzle-playability-2026-11-20' && github.event.pull_request.head.ref != 'codex/puz-ux-05-owner-live-next-replay')
    needs: home-chart-review
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Report Python and Qt runtime versions
        run: >-
          python -c "import sys, platform, PySide6, shiboken6; from PySide6.QtCore import qVersion; print('Python:', sys.version); print('Windows:', platform.platform()); print('PySide6:', PySide6.__version__); print('Qt:', qVersion()); print('shiboken6:', shiboken6.__version__); print('shiboken6 module:', shiboken6.__file__)"
      - name: Run offscreen tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -o addopts= -q -W error::pytest.PytestUnhandledThreadExceptionWarning
      - name: Compile application and tests
        run: python -m compileall -q src tests
      - name: Initialize the isolated offline window
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -X faulthandler -c "from PySide6.QtWidgets import QApplication; from chess_coach.window import MainWindow; app = QApplication([]); window = MainWindow(offline_mode=True); assert window.lichess is None; window.close()"
  visual-evidence:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || (github.event.pull_request.head.ref != 'codex/review-ux-01-game-analysis-2026-11-14' && github.event.pull_request.head.ref != 'codex/puzzle-ux-02-lichess-training-2026-11-19' && github.event.pull_request.head.ref != 'codex/puz-ux-03-online-puzzle-playability-2026-11-20' && github.event.pull_request.head.ref != 'codex/puz-ux-05-owner-live-next-replay')
    needs: home-chart-review
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Configure runner display for approved reference sizes
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Primary display: $($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -lt 1672 -or $bounds.Height -lt 941) {
            throw "Runner display cannot fit the approved 1672x941 capture."
          }
      - name: Capture native Windows Qt screens
        env:
          CC_VISUAL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          foreach ($scale in @("1", "1.25", "1.5")) {
            $env:QT_SCALE_FACTOR = $scale
            $env:CC_VISUAL_OUTPUT = "visual-evidence/scale-$scale"
            # Side-by-side images include approved reference artwork; keep them
            # outside the synthetic-only public visual-evidence artifact.
            $env:CC_VISUAL_COMPARE_OUTPUT = "visual-pairs/scale-$scale"
            if ($scale -eq "1") {
              Remove-Item Env:CC_VISUAL_TARGET_SIZES -ErrorAction SilentlyContinue
            } elseif ($scale -eq "1.25") {
              $env:CC_VISUAL_TARGET_SIZES = "1280x720"
            } else {
              $env:CC_VISUAL_TARGET_SIZES = "1120x640"
            }
            python -X faulthandler scripts/capture_visual_master.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $referencePairs = Get-ChildItem -LiteralPath "visual-evidence" -Filter "pair-*.png" -Recurse -ErrorAction SilentlyContinue
          if ($referencePairs) {
            throw "Public visual-evidence must not include side-by-side reference images."
          }
      - name: Capture the puzzle trainer at three native DPI scales
        shell: pwsh
        run: |
          $cases = @(
            @{ Scale = "1"; Size = "1672x941" },
            @{ Scale = "1.25"; Size = "1280x720" },
            @{ Scale = "1.5"; Size = "1120x640" }
          )
          foreach ($case in $cases) {
            $env:QT_SCALE_FACTOR = $case.Scale
            $env:CC_PUZZLE_VISUAL_SIZE = $case.Size
            $env:CC_PUZZLE_VISUAL_OUTPUT = "visual-evidence/puzzle-training/scale-$($case.Scale)"
            python -X faulthandler scripts/capture_puzzle_training.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-master-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/
          if-no-files-found: error
