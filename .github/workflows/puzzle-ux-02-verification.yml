name: PUZZLE-UX-02 focused verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/chess_coach/ui/pages/puzzle_training.py"
      - "src/chess_coach/lichess/puzzle_training.py"
      - "src/chess_coach/infrastructure/sqlite/puzzles.py"
      - "src/chess_coach/infrastructure/sqlite/migrations.py"
      - "src/chess_coach/window.py"
      - "scripts/capture_puzzle_training.py"
      - "tests/test_puzzle_training*.py"
      - "tests/test_puz_ux_03_*.py"
      - "tests/test_puzzle_api_adapter.py"
      - "tests/test_window.py"
      - "tests/test_board_view.py"
      - "tests/test_background_work.py"
      - ".github/workflows/puzzle-ux-02-verification.yml"
      - ".github/workflows/windows-tests.yml"

permissions:
  contents: read

concurrency:
  group: puzzle-ux-02-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-visual-scope:
    runs-on: windows-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Detect UI and capture changes for L2
        id: scope
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $files = git diff --name-only $env:BASE_SHA $env:HEAD_SHA
          $patterns = @(
            '^src/chess_coach/ui/pages/puzzle_training\.py$',
            '^src/chess_coach/lichess/puzzle_training\.py$',
            '^src/chess_coach/infrastructure/sqlite/puzzles\.py$',
            '^src/chess_coach/window\.py$',
            '^scripts/capture_puzzle_training\.py$',
            '^scripts/puz_ux_03_.*\.py$'
          )
          $changed = [bool]($files | Where-Object {
            $candidate = $_
            $patterns | Where-Object { $candidate -match $_ }
          })
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "L2 UI/capture source changed: $changed"

  l1-targeted:
    name: L1 targeted RED/GREEN
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile changed puzzle modules and tests
        run: >-
          python -m py_compile src/chess_coach/ui/pages/puzzle_training.py
          src/chess_coach/window.py
          src/chess_coach/infrastructure/sqlite/puzzles.py
          src/chess_coach/lichess/puzzle_training.py
          tests/test_puzzle_training.py tests/test_puzzle_training_store.py
          tests/test_puzzle_training_ui.py tests/test_puzzle_training_navigation.py
          tests/test_puzzle_training_async.py tests/test_puzzle_api_adapter.py
          tests/test_puz_ux_03_interaction.py tests/test_puz_ux_03_rating.py
          tests/test_window.py
      - name: Run targeted puzzle contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -X faulthandler -m pytest -o addopts= -q
          tests/test_puzzle_training.py tests/test_puzzle_training_store.py
          tests/test_puzzle_training_ui.py tests/test_puzzle_training_navigation.py
          tests/test_puzzle_training_async.py tests/test_puzzle_api_adapter.py
          tests/test_puz_ux_03_interaction.py tests/test_puz_ux_03_rating.py
          tests/test_window.py::test_puzzle_account_switch_clears_old_board_and_keeps_scope
          tests/test_window.py::test_account_switch_discards_delayed_profile_a_and_requests_profile_b
          tests/test_window.py::test_advanced_difficulty_prefetch_accepts_selected_key

  l2-native-puzzle-captures:
    name: L2 PUZ-UX-03 public and native UX
    needs: [detect-visual-scope, l1-targeted]
    if: needs.detect-visual-scope.outputs.changed == 'true' && needs.l1-targeted.result == 'success' && github.event.pull_request.head.ref == 'codex/puz-ux-03-online-puzzle-playability-2026-11-20' && github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application
        run: python -m pip install -e .
      - name: Compile the native live-smoke drivers
        run: >-
          python -m py_compile scripts/puz_ux_03_live_public_smoke.py
          scripts/puz_ux_03_mainwindow_live_integration.py
          scripts/puz_ux_03_perf_probe.py
      - name: Configure native Windows display
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          if ($bounds.Width -lt 1672 -or $bounds.Height -lt 941) {
            throw "Runner display cannot fit the 1672x941 puzzle capture."
          }
      - name: Play public Lichess puzzles in real Qt at 100, 125, and 150 percent
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}\puz-ux-03-live-localappdata
        run: |
          foreach ($scale in @("1", "1.25", "1.5")) {
            $env:CC_PUZ_UX_03_LIVE_DPI = $scale
            $env:CC_PUZ_UX_03_LIVE_OUTPUT = "visual-evidence/puz-ux-03-live-public/scale-$scale"
            python -u -X faulthandler scripts/puz_ux_03_live_public_smoke.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Exercise MainWindow with public puzzle responses
        env:
          CC_PUZ_UX_03_MAINWINDOW_OUTPUT: visual-evidence/puz-ux-03-mainwindow
          LOCALAPPDATA: ${{ runner.temp }}\puz-ux-03-mainwindow-localappdata
        run: python -u -X faulthandler scripts/puz_ux_03_mainwindow_live_integration.py
      - name: Measure ten cold and fifty warm Qt inputs
        env:
          CC_PUZ_UX_03_PERF_OUTPUT: visual-evidence/puz-ux-03-performance
          LOCALAPPDATA: ${{ runner.temp }}\puz-ux-03-performance-localappdata
        run: python -u -X faulthandler scripts/puz_ux_03_perf_probe.py
      - name: Capture puzzle workflow at 100, 125, and 150 percent
        shell: pwsh
        env:
          CC_PUZZLE_VISUAL_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          foreach ($case in @(
            @{ Scale = "1"; Size = "1672x941" },
            @{ Scale = "1.25"; Size = "1280x720" },
            @{ Scale = "1.5"; Size = "1120x640" }
          )) {
            $env:QT_SCALE_FACTOR = $case.Scale
            $env:CC_PUZZLE_VISUAL_SIZE = $case.Size
            $env:CC_PUZZLE_VISUAL_OUTPUT = "visual-evidence/puzzle-followup/scale-$($case.Scale)"
            python -X faulthandler scripts/capture_puzzle_training.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puz-ux-03-l2-${{ github.event.pull_request.head.sha }}
          path: |
            visual-evidence/puzzle-followup/
            visual-evidence/puz-ux-03-*
          if-no-files-found: error
