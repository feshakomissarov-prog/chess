[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-coach"
version = "0.1.0"
description = "Локальная шахматная доска Chess Coach"
requires-python = ">=3.12"
dependencies = [
    "chess-widgets==0.5.0",
    "PySide6>=6.10.1,<7",
    "python-chess>=1.999,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
